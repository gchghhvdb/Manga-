name: Test Single URL (Sandbox)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک مانهوا برای تست (URL)'
        required: true
        type: string
      include_paid:
        description: 'شامل چپترهای پولی/قفل‌دار؟'
        required: false
        default: false
        type: boolean
      selector:
        description: 'سلکتور CSS (اختیاری - معمولا خالی بگذارید)'
        required: false
        default: ''
        type: string

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python packages
        run: pip install requests beautifulsoup4 curl_cffi "camoufox[geoip]" playwright

      - name: Cache Camoufox browser
        id: cf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-v1

      - name: Fetch Camoufox browser
        if: steps.cf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4; do
            python -m camoufox fetch && break
            echo "retry $i"; sleep $((i*30))
          done

      - name: Run Test
        env:
          IN_URL: ${{ inputs.url }}
          IN_PAID: ${{ inputs.include_paid }}
          IN_SEL: ${{ inputs.selector }}
        run: python test_scraper.py "$IN_URL" "$IN_PAID" "$IN_SEL"
