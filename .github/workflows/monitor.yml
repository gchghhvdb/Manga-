name: Manhwa Cloud Monitor

on:
  schedule:
    - cron: '*/20 * * * *' # اجرا هر ۲۰ دقیقه یک‌بار
  workflow_dispatch: # دکمه اجرای دستی برای تست

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_monitor.py

      - name: Save updated chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manhwa_list.json
          git diff --staged --quiet || git commit -m "Update chapters"
          git push
